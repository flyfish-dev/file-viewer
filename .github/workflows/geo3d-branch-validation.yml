name: Geo3D branch validation

on:
  push:
    branches:
      - feat/geo3d-opt-in

permissions:
  contents: read

concurrency:
  group: geo3d-branch-validation
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare validation evidence
        run: |
          mkdir -p output/geo3d-validation
          git rev-parse HEAD > output/geo3d-validation/source-sha.txt
          cat > "$RUNNER_TEMP/geo3d-record.sh" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          name="$1"
          shift
          log="output/geo3d-validation/$name.log"
          printf 'Command:' > "$log"
          printf ' %q' "$@" >> "$log"
          printf '\n' >> "$log"
          "$@" 2>&1 | tee -a "$log"
          result=${PIPESTATUS[0]}
          printf '%s\t%s\n' "$name" "$result" >> output/geo3d-validation/results.tsv
          exit "$result"
          SH
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const mentioned = ['verify:format-support', 'verify:ecosystem-readmes', 'verify:offline-assets', 'verify:demo-output']
          writeFileSync('output/geo3d-validation/commands.json', JSON.stringify({
            packageManager: pkg.packageManager,
            rootTestCommand: pkg.scripts.test,
            contributorOptionalChecks: mentioned.map(name => ({
              name, command: pkg.scripts[name] ?? null,
              status: pkg.scripts[name] ? 'defined' : 'not-defined-in-this-checkout'
            }))
          }, null, 2) + '\n')
          JS

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace from frozen lockfile
        id: install
        run: bash "$RUNNER_TEMP/geo3d-record.sh" install pnpm install --frozen-lockfile

      - name: Record tool versions
        run: |
          node --version > output/geo3d-validation/node-version.txt
          pnpm --version > output/geo3d-validation/pnpm-version.txt
          python3 --version > output/geo3d-validation/python-version.txt

      - name: Focused Geo3D regression
        id: focused
        run: bash "$RUNNER_TEMP/geo3d-record.sh" geo3d-entry pnpm test:geo3d-entry

      - name: Install Chromium and WebKit
        id: browsers
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/geo3d-record.sh" playwright-install pnpm exec playwright install --with-deps chromium webkit

      - name: Focused Geo3D browser smoke
        if: ${{ !cancelled() && steps.focused.outcome == 'success' && steps.browsers.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/geo3d-record.sh" geo3d-browser pnpm --filter @file-viewer/renderer-3d verify:geo3d-browser

      # Keep full-workspace build prerequisites aligned with Public CI.
      - name: Set up Rust WASM toolchain
        id: rust
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Set up pinned Binaryen WASM optimizer
        id: binaryen
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tool_dir="$RUNNER_TEMP/file-viewer-binaryen"
          archive="$tool_dir/binaryen-version_132-node.tar.gz"
          mkdir -p "$tool_dir"
          gh release download version_132 --repo WebAssembly/binaryen --pattern binaryen-version_132-node.tar.gz --dir "$tool_dir"
          printf '%s  %s\n' 'f2f49e583f5eafbe2af5da8470177d4d10aedf149752f5dd97736f54eba6f6a2' "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$tool_dir"
          printf '%s\n' '#!/usr/bin/env bash' "exec node '$tool_dir/binaryen-version_132/wasm-opt.js' \"\$@\"" > "$tool_dir/wasm-opt"
          chmod +x "$tool_dir/wasm-opt"
          "$tool_dir/wasm-opt" --version
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Test the CHM Rust parser
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/geo3d-record.sh" chm-rust cargo test --manifest-path packages/renderers/chm/rust/Cargo.toml --locked

      - name: Verify generated MapLibre Worker
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/geo3d-record.sh" geo-worker pnpm --filter @file-viewer/renderer-geo verify:worker-source

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.binaryen.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/geo3d-record.sh" build pnpm build

      - name: Type-check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/geo3d-record.sh" type-check pnpm type-check

      - name: Full repository regression suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browsers.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/geo3d-record.sh" test pnpm test

      - name: Core and component integration regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          bash "$RUNNER_TEMP/geo3d-record.sh" integration pnpm exec vitest run \
            test/component-host-runtime-contract.spec.ts \
            test/core-options.spec.ts test/vue3-render-options.spec.ts \
            test/metadata-input-safety.spec.ts test/chm-renderer.spec.ts \
            test/pptx-generated-style-regression.spec.ts test/pptx-worker-resolution.spec.ts \
            test/pdf-worker-lifecycle.spec.ts test/pdf-runtime-provenance.spec.ts

      - name: Documentation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/geo3d-record.sh" docs-build pnpm docs:build

      - name: Governance
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/geo3d-record.sh" governance pnpm verify:github-governance

      - name: Built demo browser smoke including CHM Worker and WASM
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browsers.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/geo3d-record.sh" browser-smoke pnpm verify:browser-smoke

      - name: Prepare isolated fixture validation environment
        id: python
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/geo3d-fixtures-env"
          bash "$RUNNER_TEMP/geo3d-record.sh" fixture-install \
            "$RUNNER_TEMP/geo3d-fixtures-env/bin/python" -m pip install \
            -r packages/renderers/3d/scripts/geo3d-samples-requirements.txt

      - name: Strict Geo3D fixture and HTTP range validation
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: |
          bash "$RUNNER_TEMP/geo3d-record.sh" fixtures \
            "$RUNNER_TEMP/geo3d-fixtures-env/bin/python" \
            packages/renderers/3d/scripts/verify-geo3d-samples.py --range-smoke \
            --report output/geo3d-validation/fixtures-report.json

      - name: Compressed fixture tool regressions
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        run: |
          bash "$RUNNER_TEMP/geo3d-record.sh" fixture-tests \
            "$RUNNER_TEMP/geo3d-fixtures-env/bin/python" \
            packages/renderers/3d/scripts/test-geo3d-compressed-samples.py

      - name: Summarize executed commands
        if: ${{ !cancelled() }}
        run: |
          {
            printf '## Geo3D branch validation\n\nSource commit: `%s`\n\n' "$(git rev-parse HEAD)"
            printf 'Logs retain the actual commands and exit codes. Missing commands are not passes.\n\n'
            printf '| Check | Exit code |\n| --- | --- |\n'
            if [ -f output/geo3d-validation/results.tsv ]; then
              while IFS=$'\t' read -r name code; do
                printf '| %s | %s |\n' "$name" "$code"
              done < output/geo3d-validation/results.tsv
            fi
            printf '\nScope: contributor checks, root regression suite, selected Public CI integration checks, and Geo3D fixtures/CityJSON browser smoke. Not the full maintainer release pipeline or all-format Geo3D browser coverage.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and Geo3D visual evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: geo3d-validation-${{ github.sha }}
          path: |
            output/geo3d-validation/
            output/geo3d-browser/report.json
            output/geo3d-browser/cityjson.png
          if-no-files-found: error
          retention-days: 14
