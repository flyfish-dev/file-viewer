name: Public CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, type-check, test, build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust WASM toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Test the CHM Rust parser
        run: cargo test --manifest-path packages/renderers/chm/rust/Cargo.toml --locked

      - name: Verify repository governance
        run: pnpm verify:github-governance

      - name: Build source, components and demo
        run: pnpm build

      - name: Verify PPTX generated styles
        run: pnpm exec vitest run test/pptx-generated-style-regression.spec.ts

      - name: Verify the component host runtime contract
        run: pnpm exec vitest run test/component-host-runtime-contract.spec.ts

      - name: Type-check
        run: pnpm type-check

      - name: Test thumbnail package
        run: pnpm test

      - name: Build documentation
        run: pnpm docs:build

      - name: Build Vue 3 toolbar browser fixture
        run: pnpm build:component-demo

      - name: Verify Vue 3 toolbar contracts
        run: node apps/component-demo/scripts/verify-vue3-toolbar.mjs

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify the CHM Rust/WASM renderer in Chromium
        run: pnpm verify:chm-renderer
        env:
          CHM_SMOKE_BROWSERS: chromium

      - name: Verify Vue 3 toolbar in Chromium
        run: pnpm verify:vue3-toolbar-browser

      - name: Verify untrusted renderer markup sanitization
        run: pnpm verify:renderer-sanitization
        env:
          FILE_VIEWER_RTF_BROWSERS: chromium

      - name: Browser smoke
        run: pnpm verify:browser-smoke

      - name: Verify PPTX slideshow
        run: pnpm verify:pptx-slideshow
