name: Public CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, type-check, test, build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Select checks from the exact change and verified baseline
        id: impact
        env:
          FILE_VIEWER_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --test .github/scripts/release-ci-impact.test.mjs
          node .github/scripts/release-ci-impact.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust WASM toolchain
        if: steps.impact.outputs.runtime != 'false'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Set up pinned Binaryen WASM optimizer
        if: steps.impact.outputs.runtime != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tool_dir="$RUNNER_TEMP/file-viewer-binaryen"
          archive="$tool_dir/binaryen-version_132-node.tar.gz"
          mkdir -p "$tool_dir"
          gh release download version_132 --repo WebAssembly/binaryen --pattern binaryen-version_132-node.tar.gz --dir "$tool_dir"
          printf '%s  %s\n' 'f2f49e583f5eafbe2af5da8470177d4d10aedf149752f5dd97736f54eba6f6a2' "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$tool_dir"
          printf '%s\n' '#!/usr/bin/env bash' "exec node '$tool_dir/binaryen-version_132/wasm-opt.js' \"\$@\"" > "$tool_dir/wasm-opt"
          chmod +x "$tool_dir/wasm-opt"
          "$tool_dir/wasm-opt" --version
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Test the CHM Rust parser
        if: steps.impact.outputs.runtime != 'false'
        run: cargo test --manifest-path packages/renderers/chm/rust/Cargo.toml --locked

      - name: Verify repository governance
        run: pnpm verify:github-governance

      - name: Verify generated MapLibre Worker
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm --filter @file-viewer/renderer-geo verify:worker-source

      - name: Build source, components and demo
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm build

      - name: Verify Web Full asset manifest
        if: steps.impact.outputs.runtime != 'false'
        run: node --test packages/components/web-full/test/asset-manifest.test.mjs

      - name: Verify PPTX generated styles and Worker resolution
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm exec vitest run test/pptx-generated-style-regression.spec.ts test/pptx-worker-resolution.spec.ts

      - name: Verify the component host runtime contract
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm exec vitest run test/component-host-runtime-contract.spec.ts

      - name: Verify the Adobe design asset pack
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm --filter @file-viewer/assets-design verify

      - name: Type-check
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm type-check

      - name: Install Chromium and WebKit
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run the issue regression gates
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm test

      - name: Verify the installed DOCX diagonal-border repair
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm verify:docx-upstream

      - name: Verify optional IFC entry ownership and installed CLI execution
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm --filter @file-viewer/renderer-3d verify:ifc

      - name: Verify bounded metadata parsing and Illustrator namespace hints
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm exec vitest run test/metadata-input-safety.spec.ts test/chm-renderer.spec.ts

      - name: Build documentation
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm docs:build

      - name: Build Vue 3 toolbar browser fixture
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm build:component-demo

      - name: Verify Vue 3 toolbar contracts
        if: steps.impact.outputs.runtime != 'false'
        run: node apps/component-demo/scripts/verify-vue3-toolbar.mjs

      - name: Verify browser Avro decoding without Node globals
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm verify:data-avro-browser

      - name: Verify the optional binary inspector in Chromium
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm verify:binary-inspector

      - name: Verify the shipped Avro browser bundle and Node shim isolation
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm --filter @file-viewer/renderer-data verify:avro-browser

      - name: Verify official IFC4 and IFC4.3 rendering, picking and Worker cleanup
        if: steps.impact.outputs.runtime != 'false'
        run: |
          node packages/renderers/3d/scripts/download-ifc-fixtures.mjs /tmp/ifc-samples
          pnpm --filter @file-viewer/renderer-3d verify:ifc-browser /tmp/ifc-samples

      - name: Verify PDF Worker cancellation
        if: steps.impact.outputs.runtime != 'false'
        run: |
          pnpm exec vitest run test/pdf-worker-lifecycle.spec.ts test/pdf-runtime-provenance.spec.ts
          pnpm --filter @file-viewer/renderer-pdf verify:worker-lifecycle

      - name: Verify actual RequireJS entries and lazy renderers
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm --filter @file-viewer/web-full verify:github-258
        env:
          REQUIREJS_DEMO_DIR: apps/component-demo/dist

      - name: Verify cold Vite 6 and 8 nested-root Worker assets
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm --filter @file-viewer/vite-plugin verify:github-257-browser

      - name: Verify HTML, revisions, spreadsheet search and DOCX cover regressions
        if: steps.impact.outputs.runtime != 'false'
        run: node apps/viewer-demo/scripts/verify-closed-issue-regressions.mjs

      - name: Verify built Demo BPMN, XML profiles and Patch previews
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm verify:structured-preview-issues

      - name: Verify column dragging, sheet and zoom persistence, and the disabled option
        if: steps.impact.outputs.runtime != 'false'
        run: node apps/viewer-demo/scripts/verify-spreadsheet-resize.mjs

      - name: Verify native mobile toolbar and narrow-host search layout
        if: steps.impact.outputs.runtime != 'false'
        run: node apps/viewer-demo/scripts/verify-mobile-toolbar.mjs

      - name: Verify CAD source, monochrome and actual exported pixels
        if: steps.impact.outputs.runtime != 'false'
        run: |
          pnpm exec vitest run test/demo-file-capsule-motion.spec.ts
          node apps/viewer-demo/scripts/verify-cad-view-modes.mjs

      - name: Verify legacy XLS MiniFAT in main thread and Worker
        if: steps.impact.outputs.runtime != 'false'
        run: node apps/viewer-demo/scripts/verify-cfb-mini-fat.mjs

      - name: Verify cold-consumer fixture isolation
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm exec vitest run test/angular-asset-modes.spec.ts test/zip-cross-realm.spec.ts

      - name: Cold-install Vue CLI and React full tarballs without bundler workarounds
        if: steps.impact.outputs.runtime != 'false'
        run: node apps/component-demo/scripts/verify-packed-issue-closure.mjs

      - name: Upload packed-consumer failure evidence
        if: failure() && steps.impact.outputs.runtime != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packed-issue-consumer-evidence
          path: output/packed-issue-consumer/*/angular-regression-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload packed-consumer security evidence
        if: always() && steps.impact.outputs.runtime != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packed-consumer-security-evidence
          path: |
            output/packed-issue-consumer/*/audit-*.json
            output/packed-issue-consumer/*/package.json
            output/packed-issue-consumer/*/package-lock.json
            output/packed-issue-consumer/*/candidate-packages.json
            output/packed-issue-consumer/*/engine-candidate-provenance.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify CHM Rust/WASM build and distribution assets
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm verify:chm-renderer

      - name: Verify Vue 3 toolbar in Chromium
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm verify:vue3-toolbar-browser

      - name: Verify untrusted renderer markup sanitization
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm verify:renderer-sanitization
        env:
          FILE_VIEWER_RTF_BROWSERS: chromium

      - name: Verify Markdown fenced highlighting in Chromium and WebKit
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm verify:markdown-highlighting

      - name: Verify standalone DICOM Node inspection
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm --filter @file-viewer/renderer-dicom verify:inspection

      - name: Browser smoke, including CHM Worker/WASM
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm verify:browser-smoke

      - name: Verify PPTX slideshow
        if: steps.impact.outputs.runtime != 'false'
        run: pnpm verify:pptx-slideshow
