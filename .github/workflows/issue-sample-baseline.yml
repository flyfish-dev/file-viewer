name: Issue sample regression baseline

on:
  push:
    branches: [maintenance/sample-regressions-20260911]

permissions:
  contents: read

concurrency:
  group: issue-sample-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.0.9
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - name: Install relevant consumers and their test dependencies
        run: pnpm install --frozen-lockfile --filter @flyfish-group/file-viewer-open-source --filter @file-viewer/pptx... --filter @file-viewer/renderer-word... --filter @file-viewer/renderer-ofd... --filter @file-viewer/renderer-presentation...
      - name: Bundle installed test dependencies
        shell: bash
        run: |
          set -euo pipefail
          find . -name node_modules -type d -prune -print0 | tar --null -T - -czf /tmp/issue-consumer-dependencies.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-consumer-dependencies
          path: /tmp/issue-consumer-dependencies.tar.gz
          retention-days: 7
