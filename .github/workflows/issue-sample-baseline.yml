name: Issue sample regression baseline
on:
  push:
    branches: [maintenance/sample-regressions-20260911]
    paths: [.github/workflows/issue-sample-baseline.yml]
permissions:
  contents: read
jobs:
  word-ofd-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: payload
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8a219b750e6a1cca3938625043b1189baa4c3e4c
          path: source
      - name: Apply only the checksum-pinned reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat payload/_maintenance/issue-266.part{1,2,3}.b64 | base64 --decode | gzip --decompress > /tmp/issue-266.patch
          echo '4667d176a34710fa9ba08d3ef7fda1728656e21f60b628f605f8f64f4b57c106  /tmp/issue-266.patch' | sha256sum --check
          cd source
          git apply --index --check /tmp/issue-266.patch
          git apply --index /tmp/issue-266.patch
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const path = 'package.json';
          const text = fs.readFileSync(path, 'utf8');
          const before = '"test:word-github-266": "pnpm --filter @file-viewer/core build && pnpm --filter @file-viewer/renderer-word build"';
          const after = '"test:word-github-266": "pnpm --filter @file-viewer/core build && pnpm --filter @file-viewer/doc build && pnpm --filter @file-viewer/renderer-word build"';
          if (!text.includes(before)) throw new Error('Unexpected regression script');
          fs.writeFileSync(path, text.replace(before, after));
          JS
          git add package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.0.9
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Build and run focused regression coverage
        working-directory: source
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --filter @flyfish-group/file-viewer-open-source --filter @file-viewer/pptx... --filter @file-viewer/renderer-word... --filter @file-viewer/renderer-ofd...
          pnpm test:word-github-266
          pnpm test:ofd-github-266
          pnpm --filter @file-viewer/renderer-ofd build
          pnpm --filter @file-viewer/renderer-ofd verify:render-fidelity
          pnpm --filter @file-viewer/renderer-ofd verify:github-94
          pnpm --filter @file-viewer/renderer-ofd verify:image-placement
          pnpm --filter @file-viewer/renderer-ofd verify:pageblock-render
          pnpm exec playwright install --with-deps chromium
      - name: Reproduce all four original samples on baseline and patched code
        working-directory: source
        env:
          ISSUE_EVIDENCE_DIR: /tmp/issue-266-evidence
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 120 https://github.com/user-attachments/files/32040630/default.zip -o /tmp/issue-266.zip
          originals='packages/renderers/word/src/index.ts packages/renderers/word/src/wordDocx.ts packages/renderers/ofd/vendor/dltech/ofd/ofd_parser.js packages/renderers/ofd/vendor/dltech/ofd/ofd_render.js packages/renderers/ofd/vendor/dltech/ofd/ofd_util.js'
          for file in $originals; do git show HEAD:"$file" > "$file"; done
          node apps/viewer-demo/scripts/verify-issue-266-samples.mjs /tmp/issue-266.zip --baseline
          git restore --worktree $originals
          node apps/viewer-demo/scripts/verify-issue-266-samples.mjs /tmp/issue-266.zip
      - name: Commit and push the verified changes to a new review branch
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p docs/regressions/issue-266
          cp /tmp/issue-266-evidence/{before,after}-{ofd-date,docx-seals,wordml}.png docs/regressions/issue-266/
          git add docs/regressions/issue-266
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(word): preserve document containers and authored Word/OFD positions' -m 'Refs #266. Verify all four original public samples and repeatable zoom behavior. Diagonal borders and the existing invoice signature warning are separately documented.'
          git push origin HEAD:refs/heads/fix/word-ofd-sample-layout-266
          git rev-parse HEAD > /tmp/issue-266-evidence/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: issue-266-regression-evidence
          path: /tmp/issue-266-evidence
          retention-days: 7
