name: DOCX issue diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'feature/docx-layout-155-161'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download public issue fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/viewer-demo/public/issue-fixtures
          curl --fail --location --retry 3 \
            'https://github.com/user-attachments/files/30333140/Japanese-Template.docx' \
            --output apps/viewer-demo/public/issue-fixtures/issue-155-japanese-template.docx
          curl --fail --location --retry 3 \
            'https://github.com/user-attachments/files/30398444/-.W00213.docx' \
            --output apps/viewer-demo/public/issue-fixtures/issue-161-resume.docx

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Render diagnostic snapshots
        id: render
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/docx-issue-diagnostics
          cat > /tmp/render-docx-diagnostics.mjs <<'NODE'
          import { createReadStream, existsSync, mkdirSync, statSync, writeFileSync } from 'node:fs'
          import { createServer } from 'node:http'
          import { extname, join, normalize, resolve } from 'node:path'
          import { chromium } from 'playwright'

          const distDir = resolve('apps/viewer-demo/dist')
          const outputDir = resolve('/tmp/docx-issue-diagnostics')
          mkdirSync(outputDir, { recursive: true })
          const entryPath = join(distDir, 'index.html')
          if (!existsSync(entryPath)) throw new Error(`Missing demo build: ${entryPath}`)
          const types = {
            '.css': 'text/css; charset=utf-8',
            '.docx': 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
            '.html': 'text/html; charset=utf-8',
            '.js': 'text/javascript; charset=utf-8',
            '.json': 'application/json; charset=utf-8',
            '.mjs': 'text/javascript; charset=utf-8',
            '.png': 'image/png',
            '.svg': 'image/svg+xml',
            '.wasm': 'application/wasm'
          }
          const server = createServer((request, response) => {
            const url = new URL(request.url || '/', 'http://127.0.0.1')
            const clean = decodeURIComponent(url.pathname)
            const candidate = clean === '/' ? entryPath : join(distDir, normalize(clean).replace(/^[/\\]+/, ''))
            const file = existsSync(candidate) && statSync(candidate).isFile() ? candidate : entryPath
            response.writeHead(200, {
              'Content-Type': types[extname(file).toLowerCase()] || 'application/octet-stream',
              'Cache-Control': 'no-store'
            })
            createReadStream(file).pipe(response)
          })
          await new Promise((resolveListen, rejectListen) => {
            server.once('error', rejectListen)
            server.listen(0, '127.0.0.1', resolveListen)
          })
          const address = server.address()
          const baseUrl = `http://127.0.0.1:${address.port}`
          const browser = await chromium.launch({ headless: true })
          const cases = [
            ['155', '/issue-fixtures/issue-155-japanese-template.docx'],
            ['161', '/issue-fixtures/issue-161-resume.docx']
          ]

          try {
            for (const [id, url] of cases) {
              const page = await browser.newPage({ viewport: { width: 1600, height: 1100 }, deviceScaleFactor: 1 })
              const consoleErrors = []
              page.on('console', message => {
                if (message.type() === 'error') consoleErrors.push(message.text())
              })
              page.on('pageerror', error => consoleErrors.push(error.stack || error.message))

              await page.goto(`${baseUrl}/?lang=zh&url=${encodeURIComponent(url)}&diagnostic=issue-${id}`, {
                waitUntil: 'domcontentloaded',
                timeout: 120000
              })
              await page.waitForSelector('.file-viewer .content.docx-fit-viewer:not(.hidden)', { timeout: 120000 })
              await page.waitForTimeout(5000)
              await page.screenshot({ path: join(outputDir, `issue-${id}-viewport.png`), fullPage: false })

              const firstFrame = page.locator('.docx-page-frame, .docx-flow-frame').first()
              if (await firstFrame.count()) {
                await firstFrame.screenshot({ path: join(outputDir, `issue-${id}-first-frame.png`) })
              }

              const data = await page.evaluate(() => {
                const root = document.querySelector('.docx-fit-viewer')
                const wrapper = root?.querySelector('.docx-wrapper')
                const frames = Array.from(root?.querySelectorAll('.docx-page-frame, .docx-flow-frame') || [])
                const sections = Array.from(root?.querySelectorAll('section.docx') || [])
                const articles = Array.from(root?.querySelectorAll('section.docx > article') || [])
                const textNodes = []
                const walker = root ? document.createTreeWalker(root, NodeFilter.SHOW_TEXT) : null
                let node
                while (walker && (node = walker.nextNode())) {
                  const text = node.textContent?.trim()
                  const parent = node.parentElement
                  if (!text || !parent) continue
                  const rect = parent.getBoundingClientRect()
                  const style = getComputedStyle(parent)
                  textNodes.push({
                    text: text.slice(0, 160),
                    tag: parent.tagName,
                    className: parent.className,
                    left: rect.left,
                    top: rect.top,
                    right: rect.right,
                    bottom: rect.bottom,
                    width: rect.width,
                    height: rect.height,
                    fontSize: style.fontSize,
                    lineHeight: style.lineHeight,
                    fontFamily: style.fontFamily,
                    position: style.position,
                    transform: style.transform,
                    whiteSpace: style.whiteSpace,
                    verticalAlign: style.verticalAlign,
                    display: style.display
                  })
                  if (textNodes.length >= 2500) break
                }
                const elementSummary = elements => elements.map((element, index) => {
                  const rect = element.getBoundingClientRect()
                  const style = getComputedStyle(element)
                  return {
                    index,
                    className: element.className,
                    left: rect.left,
                    top: rect.top,
                    width: rect.width,
                    height: rect.height,
                    scrollWidth: element.scrollWidth,
                    scrollHeight: element.scrollHeight,
                    position: style.position,
                    overflow: style.overflow,
                    transform: style.transform,
                    pageWidth: style.getPropertyValue('--docx-page-width'),
                    pageHeight: style.getPropertyValue('--docx-page-height')
                  }
                })
                const allElements = root ? Array.from(root.querySelectorAll('*')) : []
                return {
                  href: location.href,
                  rootClassName: root?.className || '',
                  rootHtmlLength: root?.innerHTML.length || 0,
                  wrapper: wrapper ? elementSummary([wrapper])[0] : null,
                  frames: elementSummary(frames),
                  sections: elementSummary(sections),
                  articles: elementSummary(articles),
                  textNodes,
                  counts: {
                    frames: frames.length,
                    sections: sections.length,
                    articles: articles.length,
                    drawings: root?.querySelectorAll('svg, canvas, img').length || 0,
                    absolute: allElements.filter(element => getComputedStyle(element).position === 'absolute').length,
                    alternateChoiceMarkers: root?.querySelectorAll('[data-mc-choice], [data-alternate-choice]').length || 0
                  }
                }
              })
              data.consoleErrors = consoleErrors
              writeFileSync(join(outputDir, `issue-${id}-dom.json`), JSON.stringify(data, null, 2))
              const html = await page.locator('.docx-fit-viewer').first().evaluate(element => element.outerHTML)
              writeFileSync(join(outputDir, `issue-${id}-rendered.html`), html)
              await page.close()
            }
          } finally {
            await browser.close()
            await new Promise(resolveClose => server.close(resolveClose))
          }
          NODE
          node /tmp/render-docx-diagnostics.mjs 2>&1 | tee /tmp/docx-issue-diagnostics/render.log

      - name: Copy DOCX engine package
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/docx-issue-diagnostics/engine
          engine=$(find node_modules/.pnpm -type d -path '*/node_modules/@file-viewer/docx' -print -quit)
          if [ -n "$engine" ]; then
            cp -a "$engine"/. /tmp/docx-issue-diagnostics/engine/
            printf '%s\n' "$engine" > /tmp/docx-issue-diagnostics/engine-source-path.txt
          else
            printf 'DOCX engine package not found\n' > /tmp/docx-issue-diagnostics/engine-copy-error.txt
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-viewer-docx-issues-155-161-diagnostics
          path: /tmp/docx-issue-diagnostics
          if-no-files-found: error
          retention-days: 2
          compression-level: 6

      - name: Fail when rendering diagnostics failed
        if: steps.render.outcome == 'failure'
        run: exit 1
