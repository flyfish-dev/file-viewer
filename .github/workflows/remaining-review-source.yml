name: Remaining acceptance source
on:
  push:
    branches: [fix/compatibility-review-20260922]
    paths: [.github/workflows/remaining-review-source.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'flyfish-dev/file-viewer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive review sources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/remaining-source"
          git archive --format=tar HEAD -- packages/core packages/renderers/word packages/renderers/pptx packages/renderers/doc packages/renderers/spreadsheet packages/renderers/pdf packages/renderers/text packages/renderers/ofd packages/renderers/archive packages/renderers/shared scripts test docs/regressions patches package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json CONTRIBUTING.md apps/viewer-demo/public/vendor/docx/docx.worker.js apps/viewer-demo/public/vendor/pptx/pptx.worker.js | gzip > "$RUNNER_TEMP/remaining-source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/remaining-source/head.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remaining-acceptance-source
          path: ${{ runner.temp }}/remaining-source/
          retention-days: 1
          compression-level: 0
