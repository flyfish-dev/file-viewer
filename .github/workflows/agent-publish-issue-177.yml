name: Publish issue 177 fix

on:
  push:
    branches:
      - feat/issue-177-ofd-page-navigation

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize reviewed commit
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent/issue-177.patch.b64.* | base64 --decode > /tmp/issue-177.patch
          echo 'a8e463c278e1f846c1cbe1b510dc6f4dab0fd140f77d523e71962689584cbdef  /tmp/issue-177.patch' | sha256sum -c -
          git fetch origin main
          git reset --hard origin/main
          git apply --index /tmp/issue-177.patch
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(ofd): add page navigation controls' \
            -m 'Fixes #177 by adding previous and next controls, current and total page state, scroll-aware tracking, keyboard navigation, print-safe styling, and Chinese, English, and Japanese labels.'
          git push --force-with-lease origin HEAD:${GITHUB_REF_NAME}
