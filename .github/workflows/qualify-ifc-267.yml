name: Qualify optional IFC viewer
on:
  push:
    branches: [maintenance/sample-regressions-20260911]
    paths: [.github/workflows/qualify-ifc-267.yml]
permissions:
  contents: read
concurrency:
  group: qualify-ifc-267
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: payload
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          ref: 161d81379a8de7e2edf17a87e3f24eb0f3dc063f
      - name: Retain the previous qualified push diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ifc-evidence
          gh api --allow-escape-sequences repos/flyfish-dev/file-viewer/actions/jobs/103340605429/logs > /tmp/previous-ifc.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', Path('/tmp/previous-ifc.log').read_text(encoding='utf-8-sig'))
          lines=text.splitlines()
          selected=[line for line in lines if any(term in line.lower() for term in ['error]', 'remote:', 'rejected', 'permission', 'refusing', 'workflow scope', 'failed to push', 'fatal:', 'non-fast-forward'])]
          Path('/tmp/ifc-evidence/previous-push-diagnostic.log').write_text('\n'.join(selected))
          print('\n'.join(selected))
          PY
      - name: Validate and apply the reviewed patches
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          data=''.join(Path(f'payload/_maintenance/ifc-267.part{i}.b64').read_text().strip() for i in (1,2))
          for old,new in [('q1mrtWg32z1','q1mrtW32z1'),('5v11b6/2uX6ar1','5v11b6/2ar1'),('Waz57Vq/Ua9aUVvdrDXr626au91Wqu1m','Waz57Vq/Ua9UVvdrDXr62691Wqu1m'),('idtGvdGptr3bXVv1','idtGvdGtr3bXVv1')]: data=data.replace(old,new)
          patch=gzip.decompress(base64.b64decode(data,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='c2bbe3d9abc39a5696b762f362f0ed1a0fae6daaf0a020706df6b4bd9e3485ef'
          Path('/tmp/ifc.patch').write_bytes(patch)
          PY
          cd source
          git apply --index --check /tmp/ifc.patch
          git apply --index /tmp/ifc.patch
          git apply --index ../payload/_maintenance/ifc-267-followup.patch
          # Update the reviewed CI file through the connected maintainer after
          # this job: an Actions token cannot write workflow files.
          cp .github/workflows/public-ci.yml /tmp/ifc-evidence/public-ci-qualified.yml
          git restore --source=HEAD --staged --worktree .github/workflows/public-ci.yml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.0.9
          run_install: false
      - name: Resolve optional development dependencies and verify the frozen result
        working-directory: source
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile --filter @flyfish-group/file-viewer-open-source --filter @file-viewer/renderer-3d...
          pnpm install --frozen-lockfile --filter @flyfish-group/file-viewer-open-source --filter @file-viewer/renderer-3d...
          git add pnpm-lock.yaml
          pnpm audit --json > /tmp/ifc-evidence/audit.json || true
          pnpm verify:github-governance
          pnpm verify:public-release-facts
          pnpm --filter @file-viewer/core build
          pnpm --filter @file-viewer/geometry-engine build
          pnpm --filter @file-viewer/renderer-3d build
          pnpm --filter @file-viewer/renderer-3d verify:ifc
          pnpm exec playwright install --with-deps chromium
      - name: Render and select official IFC4 and IFC4.3 models, then dispose every Worker
        working-directory: source
        env:
          IFC_EVIDENCE_DIR: /tmp/ifc-evidence/browser
        run: |
          set -euo pipefail
          node packages/renderers/3d/scripts/download-ifc-fixtures.mjs /tmp/ifc-samples
          set +e
          pnpm --filter @file-viewer/renderer-3d verify:ifc-browser /tmp/ifc-samples > /tmp/ifc-evidence/browser.log 2>&1
          result=$?
          tail -n 100 /tmp/ifc-evidence/browser.log
          exit "$result"
      - name: Check the actual packed subpath and asset command
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p /tmp/ifc-packs
          pnpm --filter @file-viewer/core pack --pack-destination /tmp/ifc-packs
          pnpm --filter @file-viewer/geometry-engine pack --pack-destination /tmp/ifc-packs
          pnpm --filter @file-viewer/renderer-3d pack --pack-destination /tmp/ifc-packs
          mkdir -p /tmp/ifc-cold
          cd /tmp/ifc-cold
          printf '{"private":true,"type":"module","overrides":{"@thatopen/components":{"jszip":"3.10.2"}}}\n' > package.json
          npm install --ignore-scripts /tmp/ifc-packs/*.tgz @thatopen/components@3.4.8 @thatopen/fragments@3.4.7 web-ifc@0.0.77 esbuild@0.28.2
          node --input-type=module -e "import{createIfcRenderer}from'@file-viewer/renderer-3d/ifc';if(typeof createIfcRenderer!=='function')throw new Error('missing IFC export');console.log('Packed optional IFC export resolves')"
          ./node_modules/.bin/file-viewer-ifc-assets public/file-viewer/vendor/ifc
          test -s public/file-viewer/vendor/ifc/web-ifc.wasm
          test -s public/file-viewer/vendor/ifc/ifc-import.worker.js
          test -s public/file-viewer/vendor/ifc/fragments.worker.mjs
          cp public/file-viewer/vendor/ifc/manifest.json /tmp/ifc-evidence/cold-assets-manifest.json
      - name: Push the qualified optional feature without merging or publishing
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p docs/regressions/issue-267
          cp /tmp/ifc-evidence/browser/ifc4.ifc.png /tmp/ifc-evidence/browser/ifc43.ifc.png /tmp/ifc-evidence/browser/report.json docs/regressions/issue-267/
          git add docs/regressions/issue-267
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(ifc): add optional local BIM viewer with owned Worker lifecycle' -m 'Refs #267. Includes pinned official IFC4/4.3 browser gates, selection, properties, extension cleanup and self-hosted Worker/WASM assets. Ordinary model and Office entries are unchanged.'
          git push origin HEAD:refs/heads/release/readiness-20260911 2>&1 | tee /tmp/ifc-evidence/push.log
          git rev-parse HEAD > /tmp/ifc-evidence/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: optional-ifc-qualification
          path: /tmp/ifc-evidence
          retention-days: 3
