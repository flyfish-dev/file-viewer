name: Remaining input audit
on:
  push:
    branches: [fix/compatibility-review-20260922]
    paths: [.github/workflows/remaining-input-audit-20261006.yml]
permissions:
  contents: read
jobs:
  inputs:
    if: github.repository == 'flyfish-dev/file-viewer'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read exact bounded originals
        run: |
          python3 - <<'PY'
          import os,pathlib,urllib.request,hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'remaining-inputs';root.mkdir()
          items=[('C046.pptx',7455203,'a7afc41664bec43e6e4f6bce03af2dbf20f34ce9886dbe2945ccece53214019d','32083344/xxxxx.pptx'),('C009.zip',487,'dbbb2ba181355380d245d43fa768f4500485c57a34a61522e129d597038e0f52','29086587/GBK.zip')]
          for name,size,sha,part in items:
            with urllib.request.urlopen('https://github.com/user-attachments/files/'+part,timeout=60) as r:data=r.read(8*1024*1024)
            assert len(data)==size and hashlib.sha256(data).hexdigest()==sha,name
            (root/name).write_bytes(data)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remaining-directory-inputs-20261006
          path: ${{ runner.temp }}/remaining-inputs/
          retention-days: 1
