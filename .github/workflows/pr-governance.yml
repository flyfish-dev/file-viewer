name: PR Governance

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Validate PR title and evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted governance rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate title, description, verification and screenshots
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { validatePullRequest } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/governance.mjs`
            )
            const pullRequest = context.payload.pull_request
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              per_page: 100
            })
            const result = validatePullRequest({
              title: pullRequest.title,
              body: pullRequest.body || '',
              files
            })

            await core.summary
              .addHeading('PR governance')
              .addRaw(result.ok
                ? 'Title and evidence contract passed.'
                : result.errors.map(error => `- ${error}`).join('\n'))
              .write()

            if (!result.ok) {
              core.setFailed(result.errors.join('\n'))
            }
