# Temporary transfer branch only. No npm command or OIDC token is used here.
# Normal npm publishing remains on the immutable v3.3.2 source tags.
name: Recover frozen Release assets
run-name: Recover 3.3.2 frozen assets ${{ inputs.phase }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Frozen archive set to restore
        required: true
        type: choice
        options: [main, legacy]
      expected_sha:
        description: Exact reviewed transfer-controller commit
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: recover-frozen-3.3.2-assets
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact transfer controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use the frozen gzip encoder
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
      - name: Verify transfer guards and complete public source inventory
        run: |
          node --test .github/scripts/recover-frozen-assets.test.mjs
          node .github/scripts/verify-source-layout.mjs
          zstd --version
      - name: Restore only missing byte-identical Release archives
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TRANSFER_PHASE: ${{ inputs.phase }}
        run: node .github/scripts/recover-frozen-assets.mjs
