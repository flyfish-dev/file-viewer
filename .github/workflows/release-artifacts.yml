name: Frozen release artifacts

on:
  workflow_dispatch:
    inputs:
      qualification_mode:
        description: Reviewed input contract; published-release qualifies the immutable 3.3.4 stable assets
        type: choice
        options: [candidate, published-release]
        default: candidate
        required: true
      corresponding_source_commit:
        description: Immutable commit containing a new standalone CAD source snapshot
        type: string
        required: false
      source_version:
        description: Version directory of the standalone source snapshot
        type: string
        required: false
      source_revision:
        description: Optional immutable source revision for the same release version
        type: string
        required: false
  release:
    types: [published]

permissions:
  contents: read

jobs:
  corresponding-source:
    name: Verify public corresponding source and cold rebuild
    if: github.event_name == 'workflow_dispatch' && inputs.corresponding_source_commit != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CAD_SOURCE_COMMIT: ${{ inputs.corresponding_source_commit }}
      CAD_SOURCE_VERSION: ${{ inputs.source_version }}
      CAD_SOURCE_REVISION: ${{ inputs.source_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.20.0
      - name: Use the qualified npm toolchain
        run: |
          npm install --prefix "$RUNNER_TEMP/file-viewer-npm" npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org
          echo "$RUNNER_TEMP/file-viewer-npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Read exact public source bytes and rebuild the standalone integration
        env:
          FILE_VIEWER_SOURCE_CACHE: ${{ runner.temp }}/source-archives
        run: node .github/scripts/verify-cad-source-snapshot.mjs
      - name: Retain public source proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cad-public-source-proof
          path: ${{ runner.temp }}/source-archives/${{ inputs.corresponding_source_commit }}.proof.json
          if-no-files-found: error

  release-consumers:
    name: Validate frozen archives and installed consumers
    if: github.event_name != 'workflow_dispatch' || inputs.corresponding_source_commit == ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      npm_config_audit: 'false'
      FILE_VIEWER_RELEASE_QUALIFICATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification_mode || 'candidate' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification_mode == 'published-release' && '0' || '1' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.20.0
      - name: Use the qualified npm toolchain
        run: |
          npm install --prefix "$RUNNER_TEMP/file-viewer-npm" npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org
          echo "$RUNNER_TEMP/file-viewer-npm/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Download and byte-check immutable release archives
        run: |
          qualification_args=()
          case "$FILE_VIEWER_RELEASE_QUALIFICATION_MODE" in
            candidate) ;;
            published-release) qualification_args+=(--published-release) ;;
            *) exit 1 ;;
          esac
          if [[ "$FILE_VIEWER_RELEASE_QUALIFICATION_MODE" == published-release ]]; then
            node --test .github/scripts/lib/published-release-qualification.test.mjs
          fi
          node .github/scripts/runtime-ci-artifacts.mjs "${qualification_args[@]}" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/runtime-candidate"
      - name: Validate declarations, builds and offline Chromium and WebKit consumers
        run: |
          qualification_args=()
          case "$FILE_VIEWER_RELEASE_QUALIFICATION_MODE" in
            candidate) ;;
            published-release) qualification_args+=(--published-release) ;;
            *) exit 1 ;;
          esac
          node .github/scripts/runtime-ci-consumers.mjs "${qualification_args[@]}" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/runtime-candidate"
      - name: Audit only approved frozen production scopes
        env:
          RUNTIME_AUDIT_DISCLOSURE_APPROVED: ${{ vars.RUNTIME_AUDIT_DISCLOSURE_APPROVED }}
        run: |
          qualification_args=()
          case "$FILE_VIEWER_RELEASE_QUALIFICATION_MODE" in
            candidate) ;;
            published-release) qualification_args+=(--published-release) ;;
            *) exit 1 ;;
          esac
          node .github/scripts/runtime-ci-security.mjs "${qualification_args[@]}" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/runtime-candidate"
      - name: Retain consumer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frozen-release-consumers
          path: |
            ${{ runner.temp }}/runtime-ci-evidence/consumers.json
            ${{ runner.temp }}/runtime-ci-evidence/*.png
          if-no-files-found: warn
          retention-days: 14
