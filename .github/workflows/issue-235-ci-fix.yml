name: Issue 235 CI fix

on:
  push:
    branches:
      - feature/issue-235-workspace-bootstrap
    paths:
      - .github/workflows/issue-235-ci-fix.yml

permissions:
  contents: write

jobs:
  fix-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/issue-235-readable-text-previews
          fetch-depth: 0

      - name: Replace the misleading HTML filtering regex assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/renderers/text/test/readablePreview.test.mjs')
          source = path.read_text(encoding='utf-8')
          old = """    assert.match(harness.target.querySelector('code').textContent, /<script>/)\n    assert.match(harness.target.querySelector('code').textContent, /onerror=/)\n"""
          new = """    const renderedSource = harness.target.querySelector('code')?.textContent ?? ''\n    assert.equal(renderedSource.includes('<script>'), true)\n    assert.equal(renderedSource.includes('onerror='), true)\n"""
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one CodeQL-triggering assertion block, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          ! grep -n "assert\.match.*<script>" packages/renderers/text/test/readablePreview.test.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused renderer verification
        run: |
          pnpm --filter @file-viewer/core build
          pnpm --filter @file-viewer/renderer-text build
          pnpm verify:github-governance

      - name: Commit and push
        run: |
          git config user.name "Brownie Woom"
          git config user.email "161313394+brownie-cake@users.noreply.github.com"
          git add packages/renderers/text/test/readablePreview.test.mjs
          git commit -m "test(text): avoid HTML filtering regex false positive" -m "Keep the inert HTML regression focused on DOM state and literal source visibility without using a case-sensitive tag-matching regex that CodeQL interprets as an unsafe HTML filter."
          git push origin HEAD:feature/issue-235-readable-text-previews
