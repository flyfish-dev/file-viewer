name: Feature request
description: Propose a focused format, API, integration, deployment, or documentation improvement.
title: '[feature]: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Keep one request focused on one user outcome. For a new file format, include a public specification,
        a license-compatible implementation candidate, and at least one redistributable or privately shared sample.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Office / PDF / document rendering
        - CAD / engineering / 3D
        - Archive / email / ebook / media
        - Framework component or public API
        - Worker / WASM / private deployment
        - Demo / documentation / accessibility
        - Other
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: User problem and use case
      description: Who needs this, in which workflow, and what currently blocks them?
    validations:
      required: true

  - type: textarea
    id: proposed-outcome
    attributes:
      label: Proposed outcome
      description: Describe observable behavior or API acceptance criteria, not only an implementation name.
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Samples, specifications, or references
      description: For new formats, provide a legal sample/specification link or note private delivery to admin@flyfish.dev.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What do you use today, and why is it insufficient?

  - type: textarea
    id: licensing
    attributes:
      label: Dependency and license notes
      description: If suggesting a library, include its license and browser/offline/Worker/WASM implications.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Required confirmations
      options:
        - label: I searched existing issues and the roadmap for the same request.
          required: true
        - label: This request describes one focused user outcome.
          required: true
