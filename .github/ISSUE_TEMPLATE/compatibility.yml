name: File compatibility report
description: Report a real file that renders incorrectly or cannot be opened. A sample is required. / 报告渲染错误或无法打开的真实文件，必须提供样例。
title: '[compatibility]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form for fidelity, producer-specific, and real-file compatibility failures.

        **The exact or reduced file is required.** Attach a public/sanitized sample, provide a public
        link, or send it privately to `admin@flyfish.dev`. Screenshots help compare output but cannot
        identify the responsible XML, binary record, font, codec, or producer-specific structure.

        **中文：** 本表单用于还原度、特定生成软件和真实文件兼容问题。**必须提供原文件或精简样例**：附上公开 / 脱敏样例、
        提供公开链接，或私下发送到 `admin@flyfish.dev`。截图便于对比，但无法定位出问题的 XML、二进制记录、字体、编解码器或生成软件特有结构。

  - type: dropdown
    id: family
    attributes:
      label: Format family
      options:
        - Office / Word / Excel / PowerPoint / iWork
        - PDF / OFD / Typst
        - CAD / DWG / DXF / DWF / 3D
        - Archive / ZIP / RAR / 7Z / TAR
        - Email / EML / MSG / MBOX
        - Image / media / ebook
        - Drawing / mind map / EDA / data
        - Other
    validations:
      required: true

  - type: input
    id: extension
    attributes:
      label: Exact extension and producing application
      placeholder: xlsx from WPS 12.1, pptx from Microsoft 365, dwg from AutoCAD 2024
    validations:
      required: true

  - type: input
    id: packages
    attributes:
      label: Package names and exact versions
      placeholder: '@file-viewer/react-full@2.3.3'
    validations:
      required: true

  - type: dropdown
    id: sample-sharing
    attributes:
      label: Sample sharing method
      options:
        - Public or sanitized sample attached to this issue
        - Public download link provided below
        - Private sample sent to admin@flyfish.dev
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: Sample file
      description: |
        Add the public attachment/link. For private delivery, write
        `Sent to admin@flyfish.dev on YYYY-MM-DD: filename.ext` and briefly identify the producer.
        中文：附上公开附件 / 链接；私下发送时写上面的回执行，并简要说明生成软件。
      placeholder: 'Sent to admin@flyfish.dev on 2026-08-24: office365-smartart.pptx'
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: Failure location inside the file
      description: Identify the sheet, slide, page, archive entry, drawing/layout, timestamp, or object. / 指出出错的工作表、幻灯片、页面、压缩包条目、图纸 / 布局、时间点或对象。
      placeholder: Sheet 明细台账, cell F18; slide 7; page 12; archive entry docs/a.docx
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual rendering
      description: Describe what File Viewer displays, including the first relevant error or failed asset. / 描述 File Viewer 的显示结果，包括第一条相关错误或加载失败的资源。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Reference rendering
      description: Identify the application/version used as reference and the measurable expected result. / 写明作为参照的应用及版本，以及可衡量的预期结果。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser/version, OS, framework, deployment mode, base path, CSP, and self-hosted assets. / 浏览器及版本、操作系统、框架、部署方式、base path、CSP 和自托管资源。
    validations:
      required: true

  - type: textarea
    id: visual-evidence
    attributes:
      label: File Viewer and reference screenshots
      description: Provide matched screenshots at comparable zoom when the difference is visual. Remove sensitive data. / 视觉差异请提供相近缩放下的对比截图，并去除敏感信息。

  - type: checkboxes
    id: confirmations
    attributes:
      label: Required confirmations
      options:
        - label: I searched existing issues and did not find the same sample or producer-specific failure.
          required: true
        - label: I have already attached, linked, or privately sent the sample using the selected method.
          required: true
        - label: I did not create the evidence by only renaming a different file extension.
          required: true
        - label: Any public attachment is sanitized and safe to redistribute for regression testing.
          required: true
