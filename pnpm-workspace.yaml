packages:
  - packages/core
  - packages/thumbnail
  - packages/capabilities/*
  - packages/renderers/*
  - packages/presets/*
  - packages/tools/*
  - packages/components/*
  - packages/compat/*
  - apps/*
  - examples/vanilla-vite
  - examples/react-vite
  - examples/vue3-vite

peerDependencyRules:
  allowedVersions:
    '@types/react': '>=17 <20'
    react: '>=17 <20'
    react-dom: '>=17 <20'

allowBuilds:
  '@parcel/watcher': true
  ant-design-vue: true
  canvas: true
  core-js: true
  es5-ext: true
  esbuild: true
  fsevents: true

minimumReleaseAgeExclude:
  - '@file-viewer/docx@0.3.28'
  - 'styled-exceljs@0.21.4'

overrides:
  'epubjs>@xmldom/xmldom': 0.9.10
  'ansi-regex@>=4.0.0 <4.1.1': 4.1.1
  '@babel/core@7.29.0': 7.29.7
  'brace-expansion@1.1.14': 1.1.18
  'brace-expansion@2.1.1': 2.1.4
  'brace-expansion@5.0.6': 5.0.9
  dompurify: 3.4.13
  'immutable@5.1.6': 5.1.9
  'ini@<1.3.6': 1.3.8
  mermaid: 11.16.1
  nanoid: 3.3.18
  postcss: 8.5.23
  style-to-js: 1.1.21
  'undici@6.26.0': 6.28.0
  '@file-viewer/example-vanilla-vite>@file-viewer/web': workspace:3.0.0
  '@file-viewer/example-vanilla-vite>@file-viewer/preset-lite': workspace:3.0.0
  '@file-viewer/example-vanilla-vite>@file-viewer/vite-plugin': workspace:3.0.0
  '@file-viewer/example-react-vite>@file-viewer/react': workspace:3.0.0
  '@file-viewer/example-react-vite>@file-viewer/preset-office': workspace:3.0.0
  '@file-viewer/example-react-vite>@file-viewer/vite-plugin': workspace:3.0.0
  '@file-viewer/example-vue3-vite>@file-viewer/vue3-full': workspace:3.0.0
  '@file-viewer/example-vue3-vite>@file-viewer/preset-all': workspace:3.0.0
  '@file-viewer/example-vue3-vite>@file-viewer/vite-plugin': workspace:3.0.0

auditConfig:
  ignoreGhsas:
    - GHSA-5j4c-8p2g-v4jx
